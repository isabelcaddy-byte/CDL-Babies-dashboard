.resp-badge{font-size:12px;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:3px 10px;white-space:nowrap;}

#state-msg{display:flex;align-items:center;justify-content:center;padding:60px 20px;color:var(--muted);font-size:14px;gap:10px;}

.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;}

/* ── CSV parser ──────────────────────────────────────────── */
function parseCSV(text){
  const rows=[];let row=[],cell="",inQ=false;
  for(let i=0;i<text.length;i++){
    const ch=text[i],nx=text[i+1];
    if(inQ){if(ch==='"'&&nx==='"'){cell+='"';i++;}else if(ch==='"')inQ=false;else cell+=ch;}
    else{if(ch==='"')inQ=true;else if(ch===','){row.push(cell);cell="";}
    else if(ch==='\n'||(ch==='\r'&&nx==='\n')){row.push(cell);cell="";if(row.some(c=>c.trim()))rows.push(row);row=[];if(ch==='\r')i++;}
    else cell+=ch;}
  }
  if(cell||row.length){row.push(cell);if(row.some(c=>c.trim()))rows.push(row);}
  return rows;
}

/* ── gauges ──────────────────────────────────────────────── */
const RSEG=[{from:1,to:3.8,color:"#E24B4A"},{from:3.8,to:4.2,color:"#EF9F27"},{from:4.2,to:5,color:"#1D9E75"}];
const CSEG=[{from:1,to:2,color:"#E24B4A"},{from:2,to:2.5,color:"#EF9F27"},{from:2.5,to:3.5,color:"#1D9E75"},{from:3.5,to:4,color:"#EF9F27"},{from:4,to:5,color:"#E24B4A"}];
function v2a(v,mn,mx){return Math.PI-((v-mn)/(mx-mn))*Math.PI;}
function arcD(cx,cy,r,a1,a2){
  const x1=cx+r*Math.cos(a1),y1=cy-r*Math.sin(a1),x2=cx+r*Math.cos(a2),y2=cy-r*Math.sin(a2);
  return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${Math.abs(a2-a1)>Math.PI?1:0} ${a1>a2?1:0} ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}
function gauge(avgVal,n,segs,mn,mx,endLbls){
  const cx=120,cy=118,r=80,sw=22;
  const paths=segs.map(s=>`<path d="${arcD(cx,cy,r,v2a(s.from,mn,mx),v2a(s.to,mn,mx))}" fill="none" stroke="${s.color}" stroke-width="${sw}" stroke-linecap="butt"/>`).join("");
  const tvs=mx===10?[1,2,4,6,8,9,10]:[1,2,3,4,5];
  const ticks=tvs.map(v=>{const a=v2a(v,mn,mx),tr=r+sw+12;return `<text x="${(cx+tr*Math.cos(a)).toFixed(1)}" y="${(cy-tr*Math.sin(a)).toFixed(1)}" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#bbb">${v}</text>`;}).join("");
  let ndl="";
  if(avgVal!==null){const a=v2a(avgVal,mn,mx),nr=r-sw*.5-3,nx=cx+nr*Math.cos(a),ny=cy-nr*Math.sin(a),deg=(Math.PI-a)*(180/Math.PI)+90;ndl=`<polygon points="0,-10 6,0 -6,0" fill="#555" transform="translate(${nx.toFixed(1)},${ny.toFixed(1)}) rotate(${deg.toFixed(1)})"/>`;}
  const el=endLbls?`<text x="${(cx+(r+sw+30)*Math.cos(Math.PI)).toFixed(1)}" y="${(cy-(r+sw+30)*Math.sin(Math.PI)+12).toFixed(1)}" text-anchor="middle" font-size="9" fill="#bbb">${endLbls[0]}</text><text x="${(cx+(r+sw+30)*Math.cos(0)).toFixed(1)}" y="${(cy-(r+sw+30)*Math.sin(0)+12).toFixed(1)}" text-anchor="middle" font-size="9" fill="#bbb">${endLbls[1]}</text>`:"";
  const as=avgVal!==null?avgVal.toFixed(2):"–";
  return `<svg viewBox="0 0 240 158" width="240" height="158">${paths}${ticks}${ndl}${el}<text x="${cx}" y="${cy-4}" text-anchor="middle" font-size="28" font-weight="600" fill="#1a1916">${as}</text><text x="${cx}" y="${cy+18}" text-anchor="middle" font-size="11" fill="#bbb">${avgVal!==null?`n = ${n}`:"no data"}</text></svg>`;
}

function bar(id,labels,data,color,horiz){

  CR.push(new Chart(ctx,{

  }));
}

function tryNum(v){const n=parseFloat(String(v??"").replace(/[^0-9.\-]/g,""));return isNaN(n)?null:n;}
function avg(a){const ns=a.filter(v=>v!==null);return ns.length?ns.reduce((a,b)=>a+b,0)/ns.length:null;}
function freq(arr){const m={};arr.forEach(v=>{if(v&&v.trim())m[v.trim()]=(m[v.trim()]||0)+1;});return m;}
function uniq(arr){return[...new Set(arr.filter(Boolean))].sort();}
function sorted(m,n=10){return Object.entries(m).sort((a,b)=>b[1]-a[1]).slice(0,n);}


/* ── option parsing (Typeform wraps choice labels in *…*) ──── */
function opts(v){
  const s=String(v??"").trim(); if(!s) return {found:[],other:null};
  const found=[...s.matchAll(/\*([^*]+)\*/g)].map(m=>m[1].trim());
  const rest=s.replace(/\*[^*]+\*/g,"").replace(/^[\s,]+|[\s,]+$/g,"").trim();
  return {found, other: rest||null};
}
function catSingle(rows,i){return rows.map(r=>{const o=opts(r[i]);return o.found[0]||(o.other?"Other (written in)":null);}).filter(Boolean);}
function wrapL(s,n=24){const w=String(s).split(" "),out=[];let cur="";w.forEach(x=>{if((cur+" "+x).trim().length>n&&cur){out.push(cur);cur=x;}else cur=(cur+" "+x).trim();});if(cur)out.push(cur);return out.length>1?out:s;}
function escapeHtml(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ── open text translation ───────────────────────────────── */
async function translateComment(text) {
  try {
    const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(text)}`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    const lang = data[2];
    if(lang === 'en') return null;
    const translated = data[0].map(s=>s[0]).join('');
    return translated;
  } catch(e) { return null; }
}

async function translateColumn(btnEl, containerId) {
  btnEl.textContent = 'Translating…';
  btnEl.disabled = true;
  const items = document.querySelectorAll(`#${containerId} .comi`);
  for(const item of items) {
    if(item.dataset.translated) continue;
    const original = item.textContent.trim();
    if(!original) continue;
    const translation = await translateComment(original);
    if(translation) {
      item.innerHTML = `${translation}<div style="font-size:11px;color:var(--faint);margin-top:3px;font-style:italic">${original}</div>`;
    }
    item.dataset.translated = '1';
  }
  btnEl.textContent = 'Translated';
}

/* ── dedupe: one row per token, keep the completed submission ── */
function dedupeByToken(rows){
  const seen={},noTok=[];
  const partial=r=>{const s=String(r[C.sub]||"").trim();return !s||s.includes("0001");};
  rows.forEach(r=>{
    const t=String(r[C.token]||"").trim();
    if(!t){noTok.push(r);return;}
    if(!seen[t]||(partial(seen[t])&&!partial(r)))seen[t]=r;
  });
  return [...Object.values(seen),...noTok];
}

  HDRS=rows[0].map(String);buildColumns();
  ROWS=dedupeByToken(rows.slice(1).map(r=>r.map(v=>v==null?"":String(v))));
  SOURCE=src;
  const b=document.getElementById("src-badge");b.textContent=src;b.style.display="inline-block";

function geoFilter(r,withIdp){
  const country=document.getElementById("f-country").value,city=document.getElementById("f-city").value,idp=document.getElementById("f-idp").value,src=document.getElementById("f-src").value;
  if(country&&resolveCountry(r)!==country)return false;
  if(city&&resolveCity(r)!==city)return false;
  if(withIdp&&idp&&clean(r[C.idp])!==idp)return false;
  if(src&&resolveSource(r)!==src)return false;
  return true;
}

function metricColor(val, type) {
  if(val===null) return '#b8b5ad';
  if(type==='nps')    return val>=50?'#1D9E75':val>=0?'#EF9F27':'#E24B4A';
  if(type==='rec')    return val>=9?'#1D9E75':val>=7?'#EF9F27':'#E24B4A';
  if(type==='centre') {
    // 3 is perfect, green 2.5-3.5, amber 2-2.5 and 3.5-4, red outside
    const d = Math.abs(val - 3);
    return d<=0.5?'#1D9E75':d<=1?'#EF9F27':'#E24B4A';
  }
  // standard 1-5 higher is better
  return val>=4.2?'#1D9E75':val>=3.8?'#EF9F27':'#E24B4A';
}


  function relColor(val, allVals, isCentre, isNps, isRec) {
    if(val===null) return {bg:'transparent',fg:'var(--faint)'};
    const valid=allVals.filter(v=>v!==null);
    if(valid.length<2) return {bg:'var(--bg)',fg:'var(--text)'};

    // Absolute thresholds
    function isGood(v)  {
      if(isCentre) return Math.abs(v-3)<=0.5;
      if(isNps)    return v>=50;
      if(isRec)    return v>=8;   // 8-10 = green
      return v>=4.2;
    }
    function isOk(v) {
      if(isCentre) return Math.abs(v-3)<=1;
      if(isNps)    return v>=0;
      if(isRec)    return v>=6;   // 6-7 = amber
      return v>=3.8;
    }

    const anyGood  = valid.some(isGood);
    const anyBad   = valid.some(v=>!isOk(v));

    // Relative score within group
    const score = v => isCentre ? -Math.abs(v-3) : v;
    const scores = valid.map(score);
    const mn=Math.min(...scores), mx=Math.max(...scores);
    const t = mx===mn ? 0.5 : (score(val)-mn)/(mx-mn); // 0=worst, 1=best

    let r,g,b;
    if(!anyGood) {
      // All bad -- red spectrum only (dark red to light red)
      const u = t; // 0=darkest red, 1=lightest red
      r=Math.round(180+u*30); g=Math.round(60+u*80); b=Math.round(60+u*80);
    } else if(!anyBad) {
      // All good -- green spectrum only (light green to dark green)
      const u = t;
      r=Math.round(130-u*100); g=Math.round(150+u*50); b=Math.round(100+u*17);
    } else {
      // Mixed -- full red/amber/green but capped by absolute threshold
      if(isGood(val)) {
        // Green zone: lightest green (just above threshold) to darkest green (best)
        const greenVals = valid.filter(isGood);
        const gScores = greenVals.map(score);
        const gMn=Math.min(...gScores), gMx=Math.max(...gScores);
        const gt = gMx===gMn ? 1 : (score(val)-gMn)/(gMx-gMn);
        r=Math.round(100-gt*70); g=Math.round(158+gt*42); b=Math.round(100+gt*17);
      } else if(isOk(val)) {
        // Amber zone
        r=239; g=159; b=39;
      } else {
        // Red zone: light red (just below ok) to dark red (worst)
        const badVals = valid.filter(v=>!isOk(v));
        const bScores = badVals.map(score);
        const bMn=Math.min(...bScores), bMx=Math.max(...bScores);
        const bt = bMx===bMn ? 0 : (score(val)-bMn)/(bMx-bMn);
        r=Math.round(220-bt*40); g=Math.round(80+bt*40); b=Math.round(74+bt*40);
      }
    }
    const brightness = 0.299*r + 0.587*g + 0.114*b;
    const fg = brightness < 140 ? '#fff' : '#333';
    return {bg:`rgb(${r},${g},${b})`,fg};
  }

  function fmtVal(val, isNps) {
    if(val===null) return '–';
    if(isNps) return (val>0?'+':'')+val;
    return val.toFixed(1);
  }


/* ── shared metric calc ──────────────────────────────────── */
const metricDefs=[
  {key:"nps",label:"NPS",isNps:true},{key:"rec",label:"Rec /10",isRec:true},
  {key:"vfm",label:"VFM /5"},{key:"exp",label:"Expectations"},{key:"ret",label:"Return"},
  {key:"venue",label:"Venue"},{key:"staff",label:"Staff"},{key:"move",label:"Moving around"},{key:"comfort",label:"Comfort"},
  {key:"setlist",label:"Setlist"},{key:"candles",label:"Candles"},
  {key:"duration",label:"Duration",centre:true},{key:"volume",label:"Volume",centre:true},{key:"people",label:"Crowd size",centre:true},{key:"interact",label:"Interaction",centre:true},
];
function calcMetrics(rows){
  const n=i=>rows.map(r=>tryNum(r[i])).filter(v=>v!==null);
  const rn=n(C.rec),pro=rn.filter(v=>v>=9).length,det=rn.filter(v=>v<=6).length;
  const m={nps:rn.length?Math.round(((pro-det)/rn.length)*100):null,rec:avg(rn),count:rows.length,npsN:rn.length};
  metricDefs.filter(d=>!d.isNps&&!d.isRec).forEach(d=>{const v=n(C[d.key]);m[d.key]=avg(v);m[d.key+"N"]=v.length;});
  return m;
}

/* ── compare cities ──────────────────────────────────────── */
function renderComparison(){
  const MIN_N=10;
  const planRows={};
  ROWS.forEach(r=>{if(!geoFilter(r,false))return;const idp=clean(r[C.idp]);if(!idp||idp==="xxxxx")return;(planRows[idp]=planRows[idp]||[]).push(r);});
  const allPlans=Object.entries(planRows).map(([idp,rows])=>({idp,city:PLAN_MAP[idp]||(rows[0][C.p]||idp),m:calcMetrics(rows),lowN:rows.length<MIN_N}));
  if(!allPlans.length){document.getElementById("comparison").innerHTML='<p style="padding:40px;color:var(--muted);text-align:center">No data.</p>';return;}
  window._compSort=window._compSort||{key:"nps",dir:-1};
  window._compActive=window._compActive||new Set(metricDefs.map(m=>m.key));
  const score=(met,v)=>met&&met.centre?-Math.abs(v-3):v;
  function sortPlans(){
    const {key,dir}=window._compSort,met=metricDefs.find(m=>m.key===key);
    allPlans.sort((a,b)=>{
      if(key==="city")return a.city.localeCompare(b.city)*dir;
      const av=key==="count"?a.m.count:a.m[key],bv=key==="count"?b.m.count:b.m[key];
      if(av===null&&bv===null)return 0;if(av===null)return 1;if(bv===null)return -1;
      return ((score(met,av)-score(met,bv))*dir)||((b.m.rec??0)-(a.m.rec??0));
    });
  }
  function vsOthers(plan,pool){
    return metricDefs.filter(m=>!m.isNps&&!m.isRec).map(m=>{
      const val=plan.m[m.key];if(val===null)return null;
      const ov=pool.filter(p=>p.idp!==plan.idp).map(p=>p.m[m.key]).filter(v=>v!==null);if(!ov.length)return null;
      const oa=ov.reduce((a,b)=>a+b,0)/ov.length;
      return {label:m.label,diff:m.centre?(Math.abs(oa-3)-Math.abs(val-3)):(val-oa)};
    }).filter(Boolean);
  }
  const fmtCity=p=>p.city.split(" (")[0];
  function insightBlock(){
    const full=[...allPlans].filter(p=>!p.lowN).sort((a,b)=>((b.m.nps??-999)-(a.m.nps??-999))||((b.m.rec??0)-(a.m.rec??0)));
    if(full.length<2)return "";
    const lines=[],top=full[0],bottom=full[full.length-1];
    const strengths=vsOthers(top,full).filter(s=>s.diff>0.2).sort((a,b)=>b.diff-a.diff).slice(0,3).map(s=>s.label);
    lines.push(`<strong>${fmtCity(top)}</strong> leads with an NPS of ${top.m.nps>0?"+":""}${top.m.nps} (n = ${top.m.count})${strengths.length?". It scores above the other cities on "+strengths.join(", "):""}.`);
    const weak=vsOthers(bottom,full).filter(s=>s.diff<-0.2).sort((a,b)=>a.diff-b.diff).slice(0,3).map(s=>s.label);
    lines.push(`<strong>${fmtCity(bottom)}</strong> has the lowest NPS at ${bottom.m.nps>0?"+":""}${bottom.m.nps} (n = ${bottom.m.count})${weak.length?", with the biggest gaps in "+weak.join(", "):""}.`);
    const mean=k=>{const v=full.map(p=>p.m[k]).filter(x=>x!==null);return v.length?v.reduce((a,b)=>a+b,0)/v.length:null;};
    const sysWeak=metricDefs.filter(m=>{const mv=mean(m.key);if(mv===null)return false;if(m.centre)return Math.abs(mv-3)>0.6;if(m.isNps)return mv<0;if(m.isRec)return mv<7;return mv<3.8;}).map(m=>m.label);
    if(sysWeak.length)lines.push(`Across the larger cities, <strong>${sysWeak.join("</strong>, <strong>")}</strong> ${sysWeak.length===1?"scores":"score"} below target. This points to a product-level issue rather than a local one.`);
    const sysStrong=metricDefs.filter(m=>{const mv=mean(m.key);if(mv===null||m.centre)return false;if(m.isNps)return mv>=50;if(m.isRec)return mv>=8;return mv>=4.2;}).map(m=>m.label);
    if(sysStrong.length)lines.push(`<strong>${sysStrong.join("</strong>, <strong>")}</strong> ${sysStrong.length===1?"is":"are"} consistently strong across cities.`);
    const lowNames=allPlans.filter(p=>p.lowN).map(fmtCity);
    if(lowNames.length)lines.push(`${lowNames.join(", ")} ${lowNames.length===1?"has":"have"} fewer than ${MIN_N} responses so ${lowNames.length===1?"is":"are"} left out of these highlights.`);
    return `<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px 24px;margin-bottom:24px">
      <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:12px">Highlights</div>
      <ul style="list-style:none;display:flex;flex-direction:column;gap:10px">${lines.map(l=>`<li style="font-size:13px;line-height:1.6;color:var(--text);padding-left:16px;position:relative"><span style="position:absolute;left:0;color:var(--faint)">·</span>${l}</li>`).join("")}</ul>
    </div>`;
  }
  function fmtVal(v,isNps){if(v===null)return "–";if(isNps)return (v>0?"+":"")+v;return v.toFixed(1);}
  function drawTable(){
    const act=metricDefs.filter(m=>window._compActive.has(m.key)),sk=window._compSort.key,sd=window._compSort.dir;
    const arrow=k=>sk===k?(sd===-1?"↓":"↑"):"⇅";
    let t=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;align-items:center"><span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:4px">Show:</span>`;
    metricDefs.forEach(m=>{const on=window._compActive.has(m.key);t+=`<button onclick="window._compToggle('${m.key}')" style="font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;border:1px solid ${on?"var(--text)":"var(--border)"};background:${on?"var(--text)":"var(--surface)"};color:${on?"var(--surface)":"var(--muted)"};cursor:pointer">${m.label}</button>`;});
    t+=`</div><div style="overflow-x:auto;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)"><table style="width:100%;border-collapse:collapse;font-size:13px"><thead><tr style="border-bottom:2px solid var(--border)">
      <th class="sort-th" style="text-align:left;padding:10px 14px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap" onclick="window._compSetSort('city')">City <span style="color:var(--faint);font-size:10px">${arrow("city")}</span></th>
      <th class="sort-th" style="text-align:center;padding:10px 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);white-space:nowrap" onclick="window._compSetSort('count')">n <span style="color:var(--faint);font-size:10px">${arrow("count")}</span></th>`;
    act.forEach(m=>{const a=sk===m.key;t+=`<th class="sort-th" style="text-align:center;padding:10px 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:${a?"var(--text)":"var(--muted)"};white-space:nowrap" onclick="window._compSetSort('${m.key}')">${m.label} <span style="font-size:10px;color:${a?"var(--text)":"var(--faint)"}">${arrow(m.key)}</span></th>`;});
    t+=`</tr></thead><tbody>`;
    allPlans.forEach(p=>{
      const country=(p.city.match(/\(([^)]+)\)/)||[])[1]||"";
      t+=`<tr style="border-bottom:1px solid var(--border);opacity:${p.lowN?"0.4":"1"}"><td style="padding:10px 14px;font-weight:500;white-space:nowrap">${fmtCity(p)}${p.lowN?' <span style="font-size:10px;color:var(--faint);font-weight:400">low n</span>':""}<br><span style="font-size:11px;color:var(--faint);font-weight:400">${country} · ${p.idp}</span></td><td style="padding:10px 8px;text-align:center;color:var(--muted);font-size:12px">${p.m.count}</td>`;
      act.forEach(m=>{const v=p.m[m.key];const {bg,fg}=relColor(v,allPlans.map(q=>q.m[m.key]),!!m.centre,!!m.isNps,!!m.isRec);t+=`<td style="padding:10px 8px;text-align:center;font-weight:600;background:${bg};color:${fg};${sk===m.key?"outline:2px solid rgba(0,0,0,0.15);outline-offset:-2px":""}">${fmtVal(v,m.isNps)}</td>`;});
      t+=`</tr>`;
    });
    t+=`</tbody></table></div><div style="font-size:11px;color:var(--muted);text-align:right;margin-top:10px">Click any column header to sort · greyed rows = fewer than ${MIN_N} responses · Duration, Volume, Crowd size, Interaction: 3 = just right</div>`;
    document.getElementById("comp-table-area").innerHTML=t;
  }
  window._compSetSort=k=>{if(window._compSort.key===k)window._compSort.dir*=-1;else window._compSort={key:k,dir:-1};sortPlans();drawTable();};
  window._compToggle=k=>{const s=window._compActive;if(s.has(k)){if(s.size>1)s.delete(k);}else s.add(k);drawTable();};
  sortPlans();
  document.getElementById("comparison").innerHTML=insightBlock()+'<div id="comp-table-area"></div>';
  drawTable();
}

/* ── trends (by submission week) ─────────────────────────── */
const MIN_PT=3;
let trendCharts=[],activeTrendMetric="nps",activeTrendGroup="all";
function weekStart(s){const d=new Date(String(s).trim().replace(" ","T").slice(0,10)+"T00:00:00Z");if(isNaN(d)||d.getUTCFullYear()<2000)return null;const day=(d.getUTCDay()+6)%7;d.setUTCDate(d.getUTCDate()-day);return d.toISOString().slice(0,10);}
function renderTrends(){
  trendCharts.forEach(c=>c.destroy());trendCharts=[];
  const met=metricDefs.find(m=>m.key===activeTrendMetric);
  const rows=filteredRows();
  const groupKey={all:()=>"All responses",country:resolveCountry,source:resolveSource}[activeTrendGroup];
  const series={};
  rows.forEach(r=>{const w=weekStart(r[C.sub]);const k=groupKey(r);if(!w||!k)return;((series[k]=series[k]||{})[w]=series[k][w]||[]).push(r);});
  const keys=Object.keys(series).sort();
  const el=document.getElementById("trends");
  if(!keys.length){el.innerHTML='<p style="padding:40px;color:var(--muted);text-align:center">No dated responses for the current selection.</p>';return;}
  const allWeeks=[...new Set(keys.flatMap(k=>Object.keys(series[k])))].sort();
  const COLORS=["#185FA5","#534AB7","#1D9E75","#EF9F27","#E24B4A","#7F77DD","#5DCAA5","#BA7517"];
  const datasets=keys.map((k,i)=>{
    const pts=allWeeks.map(w=>{const rs=series[k][w];if(!rs||rs.length<MIN_PT)return null;const m=calcMetrics(rs);const v=m[met.key];return v===null?null:(met.isNps?v:+v.toFixed(2));});
    return {label:k,data:pts,nCounts:allWeeks.map(w=>series[k][w]?.length||0),borderColor:COLORS[i%COLORS.length],backgroundColor:COLORS[i%COLORS.length]+"33",pointRadius:5,pointHoverRadius:7,tension:.3,fill:false,spanGaps:true};
  });
  const pill=(on,js,label)=>`<button onclick="${js}" style="font-size:11px;font-weight:500;padding:4px 10px;border-radius:20px;border:1px solid ${on?"var(--text)":"var(--border)"};background:${on?"var(--text)":"var(--surface)"};color:${on?"var(--surface)":"var(--muted)"};cursor:pointer">${label}</button>`;
  const lab=s=>`<span style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-right:4px">${s}</span>`;
  let ui=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;align-items:center">${lab("Metric:")}${metricDefs.map(m=>pill(m.key===activeTrendMetric,`activeTrendMetric='${m.key}';renderTrends();`,m.label)).join("")}</div>`;
  ui+=`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;align-items:center">${lab("Group by:")}${[["all","All"],["country","Country"],["source","Source"]].map(([k,l])=>pill(k===activeTrendGroup,`activeTrendGroup='${k}';renderTrends();`,l)).join("")}</div>`;
  ui+=`<div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px"><div style="position:relative;height:360px"><canvas id="trend-main"></canvas></div></div>
  <div style="font-size:11px;color:var(--faint);text-align:right;margin-top:10px">x-axis = week the survey was submitted (Mon start) · hover a point to see n · weeks with fewer than ${MIN_PT} responses are not plotted · dashed line = target</div>`;
  el.innerHTML=ui;
  const threshold=met.centre?3:met.isNps?0:met.isRec?7:4.2;
  const thresholdLabel=met.centre?"3 = just right":met.isNps?"NPS 0":met.isRec?"Target 7":"Target 4.2";
  datasets.push({label:thresholdLabel,data:allWeeks.map(()=>threshold),borderColor:"#b8b5ad",borderWidth:1.5,borderDash:[5,5],pointRadius:0,fill:false,tension:0,order:99});
  trendCharts.push(new Chart(document.getElementById("trend-main"),{type:"line",data:{labels:allWeeks,datasets},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:true,labels:{color:"#7a776e",font:{size:11},boxWidth:12}},tooltip:{callbacks:{afterLabel:ctx=>{const n=ctx.dataset.nCounts?.[ctx.dataIndex];return n?`n = ${n}`:"";}}}},
      scales:{x:{grid:{display:false},ticks:{color:"#7a776e",font:{size:11}}},y:{min:met.isNps?-100:met.isRec?0:1,max:met.isNps?100:met.isRec?10:5,grid:{color:"rgba(0,0,0,.05)"},ticks:{color:"#7a776e",font:{size:11}}}}}}));
}
</script>
